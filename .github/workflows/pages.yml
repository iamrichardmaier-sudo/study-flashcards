# Posts the ECON 381 site (site/) to GitHub Pages:
#   https://iamrichardmaier-sudo.github.io/study-flashcards/
#
# One-time setup: repo Settings → Pages → Build and deployment → Source:
# "GitHub Actions". After that every push to main rebuilds and redeploys.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and check the deck, models and site
        run: |
          node tools/build.mjs
          node --test tools/schedule.test.mjs tools/models.test.mjs tools/practice.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
